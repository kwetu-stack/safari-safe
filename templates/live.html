<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Tracking</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Journey Live</h1>

        <p>
            Your live location can now be shared with trusted family members.
        </p>

        <div class="journey-box">
            Journey ID:
            <strong>{{ journey_id }}</strong>
        </div>

        <div class="link-box">
            <p><strong>Tracking Link</strong></p>

            <input
                type="text"
                id="trackingLink"
                readonly
                value="{{ request.host_url }}track/{{ journey_id }}"
            >

            <button onclick="copyLink()">
                Copy Tracking Link
            </button>
        </div>

        <button onclick="sendLocation()">
            Share My Live Location
        </button>

        <p id="status" class="status-text">
            Waiting to share location...
        </p>

    </div>

<script>

function copyLink() {
    const copyText = document.getElementById("trackingLink");

    copyText.select();
    copyText.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(copyText.value);

    alert("Tracking link copied!");
}

function sendLocation() {

    const status = document.getElementById("status");

    if (!navigator.geolocation) {
        sendFallback("Geolocation not supported");
        return;
    }

    status.innerText = "Getting your GPS location...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            sendToServer(lat, lng, "Live location shared successfully");

        },

        function(error) {

            sendFallback("GPS blocked, using fallback location");

        }

    );
}

function sendFallback(message) {

    // Nairobi fallback location
    sendToServer(-1.2921, 36.8219, message);
}

function sendToServer(lat, lng, message) {

    fetch("/update_location/{{ journey_id }}", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            latitude: lat,
            longitude: lng
        })

    })

    .then(res => res.json())

    .then(data => {

        document.getElementById("status").innerText =
            message;

        console.log(data);

    });

}

</script>

</body>
</html>
