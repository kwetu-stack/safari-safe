<!DOCTYPE html>
<html>
<head>
    <title>Tracking Page</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>

    <style>
        body {
            font-family: Arial;
        }
        #map {
            height: 500px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Tracking Page</h1>
<p>Journey ID: {{ journey_id }}</p>

<div id="status">Connecting...</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

<script>
    const journeyId = "{{ journey_id }}";
    const BASE = window.location.origin;

    // Default location (Nairobi)
    let currentLat = -1.2921;
    let currentLng = 36.8219;

    let map = L.map('map').setView([currentLat, currentLng], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker = L.marker([currentLat, currentLng]).addTo(map);

    function updateLocation() {
        fetch(`${BASE}/get_location/${journeyId}`)
            .then(res => res.json())
            .then(data => {

                if (data.lat && data.lng) {
                    document.getElementById("status").innerText =
                        `Live Location: ${data.lat}, ${data.lng}`;

                    smoothMove(data.lat, data.lng);

                } else {
                    document.getElementById("status").innerText =
                        "Waiting for traveler...";
                }
            })
            .catch(err => {
                document.getElementById("status").innerText =
                    "Connection lost. Retrying...";
                console.error(err);
            });
    }

    // Smooth movement instead of jumping
    function smoothMove(newLat, newLng) {
        const steps = 20;
        const latStep = (newLat - currentLat) / steps;
        const lngStep = (newLng - currentLng) / steps;

        let i = 0;

        const interval = setInterval(() => {
            if (i >= steps) {
                clearInterval(interval);
                currentLat = newLat;
                currentLng = newLng;
                return;
            }

            currentLat += latStep;
            currentLng += lngStep;

            marker.setLatLng([currentLat, currentLng]);
            map.setView([currentLat, currentLng], 15);

            i++;
        }, 50);
    }

    // Poll every 3 seconds
    setInterval(updateLocation, 3000);

    // First load
    updateLocation();
</script>

</body>
</html>
