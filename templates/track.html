<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Safari Safe Tracking</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

    <style>

        #map {
            height: 600px;
            width: 100%;
            border-radius: 24px;
            margin-top: 20px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.08);
        }

        .tracking-card {
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 24px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .live-badge {
            display: inline-block;
            background: #dc2626;
            color: white;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .location-text {
            font-size: 24px;
            margin-top: 15px;
            color: #38bdf8;
            line-height: 1.5;
        }

        .journey-id {
            font-size: 24px;
            color: white;
        }

        .end-btn {
            width: 100%;
            margin-top: 25px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .end-btn:hover {
            background: #b91c1c;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="live-badge">
        LIVE TRACKING ACTIVE
    </div>

    <h1>Tracking Journey</h1>

    <p>
        Live journey location updates in real time.
    </p>

    <div class="tracking-card">

        <div class="journey-id">
            <strong>Journey ID:</strong>
            {{ journey_id }}
        </div>

        <div id="status"
             class="location-text">

            Waiting for live location...

        </div>

    </div>

    <div id="map"></div>

    <!-- END JOURNEY BUTTON -->
    <button class="end-btn"
            onclick="endJourney()">

        End Journey

    </button>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

<script>

const journeyId = "{{ journey_id }}";

let firstUpdate = true;

let map = L.map('map').setView(
    [-1.2921, 36.8219],
    13
);

// OpenStreetMap
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 20
}).addTo(map);

// Marker
let marker = L.marker(
    [-1.2921, 36.8219]
).addTo(map);

function updateLocation() {

    fetch(`/get_location/${journeyId}`)

    .then(res => res.json())

    .then(data => {

        // Journey ended
        if (data.ended) {

            document.getElementById("status").innerText =
                "Journey has ended safely.";

            clearInterval(refreshInterval);

            const badge =
                document.querySelector(".live-badge");

            if (badge) {

                badge.innerText =
                    "JOURNEY ENDED";

                badge.style.background =
                    "#16a34a";
            }

            return;
        }

        // Live location exists
        if (data.lat && data.lng) {

            document.getElementById("status").innerText =
                `Current Location:
                ${data.lat},
                ${data.lng}`;

            marker.setLatLng([
                data.lat,
                data.lng
            ]);

            // Only set view first time
            if (firstUpdate) {

                map.setView([
                    data.lat,
                    data.lng
                ], 13);

                firstUpdate = false;
            }

        }

        else {

            document.getElementById("status").innerText =
                "Waiting for live location...";

        }

    })

    .catch(error => {

        document.getElementById("status").innerText =
            "Connection problem.";

        console.error(error);

    });

}

// END JOURNEY
function endJourney() {

    fetch(`/end_journey/${journeyId}`, {

        method: "POST"

    })

    .then(res => res.json())

    .then(data => {

        alert("Journey ended successfully.");

        document.getElementById("status").innerText =
            "Journey has ended safely.";

    })

    .catch(error => {

        alert("Failed to end journey.");

        console.error(error);

    });

}

// Refresh every 3 seconds
const refreshInterval =
    setInterval(updateLocation, 3000);

// Initial load
updateLocation();

</script>

</body>
</html>
